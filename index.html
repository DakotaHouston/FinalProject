<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dak's Jewlery</title>
</head>
<body>
    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="index.html"><b>Home</b></a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="product.html">Products</a></li>
        </ul>
        <button class="menu-toggle" aria-label="Toggle navigation menu">☰</button>
    </nav>
    <header><h1 id="banner-text"> Dak's Jewlery</h1></header>
    <main class="products">
        <section class="Gold">
            <h2>Gold</h2>
            <div class="gold">
                <img src="../unit 5/images/goldearrings.png" alt="an image of gold earrings">
                <img src="../unit 5/images/goldring.png" alt="an image of a gold ring">
                <img src="../unit 5/images/goldneclace.png" alt="an image of a gold neclace">
                <img src="../unit 5/images/goldbraclet.png" alt="an image of a gold braclet">
            </div>
        </section>

        <section class="silver">
            <h2>Silver</h2>
            <div class="silver">
                <img src="../unit 5/images/silverearrings.png" alt="an image of silver earrings">
                <img src="../unit 5/images/silverring.png" alt="an image of a silver ring">
                <img src="../unit 5/images/silverneclace.png" alt="an image of a silver neclace">
                <img src="../unit 5/images/silverbraclet.png" alt="an image of a silver braclet">
            </div>
        </section>

        <section class="Pearl">
            <h2>Pearl</h2>
            <div class="pearl">
                <img src="../unit 5/images/pearlearrings.png" alt="an image of pearl earrings">
                <img src="../unit 5/images/pearlring.png" alt="an image of a pearl ring">
                <img src="../unit 5/images/pearlneclace.png" alt="an image of a pearl neclace">
                <img src="../unit 5/images/pearlbraclet.png" alt="an image of a pearl braclet">
            </div>
        </section>
    </main>
</body>
<style>
    .products{
        display: flex;
        flex-direction: column; /* Stack items vertically */
        align-items: center;    /* Center items horizontally */
        justify-content: center; /* Center items vertically if a height is set */
        width: 100%;  
    }
    img{
        max-height: 150px;
        min-width: 175px;
    }
    body {             
	    background-color: #dadada;
    }
    header {
    	color: rgb(0, 0, 0);
	    background-image: url(images/Jewlery.jpeg);
    	filter: blur(0.03em);
	    display: flex;
    	align-items: center;
	    justify-content: center;
    }
    h2 {
        padding-left: 7px;
    	background-color: #37206b;
	    color: white;
    	border-radius: 5px;
	    width: 75px;
    }
    * {
	    margin: 0;
    	padding: 0;
	    box-sizing: border-box;
    }
    .navbar {
	    display: flex;
    	justify-content: space-between;
	    align-items: center;
    	background-color: #333;
	    padding: 10px 20px;
    }
    .nav-links {
    	list-style: none;
	    display: flex;
    }
    .nav-links a {
    	color: white;
	    text-decoration: none;
    	padding: 10px 15px;
	    display: block;
    }
    .menu-toggle {
    	display: none;
	    background: none;
    	border: none;
	    color: white;
    	font-size: 2rem;
	    cursor: pointer;
    }
    @media (max-width: 768px) {
    	.menu-toggle {
		    display: block;
	    }
	    .nav-links {
		    display: none;
	    	flex-direction: column;
    		position: absolute;
		    top: 60px;
	    	left: 0;
    		width: 100%;
		    background-color: #444;
	    }
	    .nav-links.active {
    		display: flex;
	    }
    }
</style>
<script>
    const toggle=document.querySelector(".menu-toggle");
    const navLinks=document.querySelector(".nav-links");

    toggle.addEventListener("click", () => {
        navLinks.classList.toggle("active");
    });
</script>
</html>
