<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dak's Jewlery</title>
</head>
<body>
    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="product.html"><b>Products</b></a></li>
            <li><a href="index.html">Home</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <button class="menu-toggle" aria-label="Toggle navigation menu">☰</button>
    </nav>
    <header><div id="banner-text"><h1 id="header-text"> Dak's Jewlery</h1></header></div>
    <div class="container"> 
        <table>
            <tr>
                <th>      </th>
                <th>Gold</th>
                <th>Silver</th>
                <th>Pearl</th>
            </tr>
            <tr>
                <th>Neclace</th>
                <td><img src="../unit 5/images/goldneclace.png" alt="an image of a gold neclace"><br>$50.00</td>
                <td><img src="../unit 5/images/silverneclace.png" alt="an image of a silver neclace"><br>$50.00</td>
                <td><img src="../unit 5/images/pearlneclace.png" alt="an image of a pearl neclace"><br>$50.00</td>
            </tr>
            <tr>
                <th>Braclet</th>
                <td><img src="../unit 5/images/goldbraclet.png" alt="an image of a gold braclet"><br>$40.00</td>
                <td><img src="../unit 5/images/silverbraclet.png" alt="an image of a silver braclet"><br>$40.00</td>
                <td><img src="../unit 5/images/pearlbraclet.png" alt="an image of a pearl braclet"><br>$40.00</td>
            </tr>
            <tr>
                <th>Ring</th>
                <td><img src="../unit 5/images/goldring.png" alt="an image of a gold ring"><br>$30.00</td>
                <td><img src="../unit 5/images/silverring.png" alt="an image of a silver ring"><br>$30.00</td>
                <td><img src="../unit 5/images/pearlring.png" alt="an image of a pearl ring"><br>$30.00</td>
            </tr>
            <tr>
                <th>Earrings</th>
                <td><img src="../unit 5/images/goldearrings.png" alt="an image of gold earrings"><br>$20.00</td>
                <td><img src="../unit 5/images/silverearrings.png" alt="an image of silver earrings"><br>$20.00</td>
                <td><img src="../unit 5/images/pearlearrings.png" alt="an image of pearl earrings"><br>$20.00</td>
            </tr>
        </table>
    </div>
</body>
<style>
    .container {
	    padding-left: 10%;
	    padding-top: 30px;
	    display: flex;
	    justify-content: center;
	    width: 90%;
    }
    table {
        border-collapse: collapse;
        border-radius: 50px;
        overflow: hidden; 
        background-color: #37206b;
        color: white;
    	width: 100%;
    	max-width: 100%;
	    border-collapse: collapse;
    	text-align: left;
    	font-size: 122%;
    	margin: 0;
    }
    th,
    td {
    	border: 2px solid rgb(255, 255, 255);
    	padding: 3px;
    	font-size: 122%;
    	text-align: center;
    }
    body {
    	background-color: #dadada;
    }
    header {
    	color: rgb(0, 0, 0);
    	background-image: url(images/Jewlery.jpeg);
    	filter: blur(0.03em);
    	display: flex;
    	align-items: center;
    	justify-content: center;
    }
    * {
    	margin: 0;
    	padding: 0;
    	box-sizing: border-box;
    }
    .navbar {
	    display: flex;
	    justify-content: space-between;
	    align-items: center;
	    background-color: #333;
	    padding: 10px 20px;
    }
    .nav-links {
	    list-style: none;
	    display: flex;
    }
    .nav-links a {
	    color: white;
    	text-decoration: none;
	    padding: 10px 15px;
	    display: block;
    }
    .menu-toggle {
	    display: none;
    	background: none;
	    border: none;
    	color: white;
	    font-size: 2rem;
	    cursor: pointer;
    }
    @media (max-width: 768px) {
	    .menu-toggle {
		    display: block;
	    }
	    .nav-links {
		    display: none;
    		flex-direction: column;
	    	position: absolute;
		    top: 60px;
    		left: 0;
	    	width: 100%;
		    background-color: #444;
	    }
    	.nav-links.active {
	    	display: flex;
	    }
    }
</style>
<script>
        const toggle = document.querySelector(".menu-toggle");
        const navLinks = document.querySelector(".nav-links");

        toggle.addEventListener("click", () => {
            navLinks.classList.toggle("active");
        });
</script>
</html>
